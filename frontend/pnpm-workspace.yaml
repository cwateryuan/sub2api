packages:
  - '.'

allowBuilds:
  esbuild: true
  vue-demi: true

# pnpm 10+ reads overrides from this workspace file; pnpm 9 uses the same
# configuration when Docker installs the frozen lockfile.
overrides:
  js-cookie: 3.0.7
  form-data@<4.0.6: '>=4.0.6'
  postcss@<8.5.18: '>=8.5.18'
  dompurify@<3.4.14: '>=3.4.14'
  source-map-js@<1.2.2: '>=1.2.2'
